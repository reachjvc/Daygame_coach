<title>One-Pager Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:ital,wght@0,400..700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,400..800&display=swap">
<style>
/* v3 prototype. The shell (top bar, review panel) wraps one or two frames; each frame holds a .page that is a
   container, so the page itself lays out by its own width (phone 390 px, wide 1280 px) through container queries.
   Version 1 keeps the owner's 2025 sheet (ink, red, condensed Archivo). Version 2 is set on .page.v2. Review
   controls use the dashed blue "lab" style from round 3 so they never read as page content. */
:root {
  --bg: #e7e5e2; --paper: #ffffff; --ink: #161414; --ink-2: #4b4646; --muted: #6a6362;
  --rule: #1d1a1a; --hair: #d9d4d2; --panel: #f2f0ee; --pink: #f7d4d5; --red: #c8202a;
  --band: #ece8e4; --q: #b9b2ae; --med: #161414;
  /* graph lines (round 8): hard things warm, solid, one marker shape each; good changes cool, dashed. Validated with the
     dataviz skill's validate_palette.js per family, all pairs: light passes; dark's red/amber pair sits in the 6-8 CVD band,
     legal because marker shape, legend and the hover figures also carry identity */
  --fl-hard1: #e34948; --fl-hard2: #eda100; --fl-hard3: #6250d6; --fl-hard4: #8c2f7a; --fl-good1: #2a78d6; --fl-good2: #008300;
  --watch: #9a5500; --danger: #c41d2a; --win: #1c7a3c;
  --lab: #2f5f8f; --lab-bg: #eef3f8; --ph-bg: #fbf1d4; --ph-line: #e1cd8c;
  --v2-bg: #f4f6f3; --v2-ink: #10201a; --v2-ink2: #3e4d46; --v2-acc: #0d6b4f; --v2-soft: #dcebe3; --v2-hot: #b5482a; --v2-line: #c9d6cf;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-serif: "Fraunces", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --paper: #1c1919; --ink: #f2eeed; --ink-2: #c8c1c0; --muted: #958d8c;
    --rule: #d8d2d1; --hair: #3a3434; --panel: #262222; --pink: #4a2629; --red: #ff5c63;
    --band: #2c2727; --q: #5b5352; --med: #f2eeed;
    --fl-hard1: #e8455a; --fl-hard2: #c98500; --fl-hard3: #9085e9; --fl-hard4: #9040c0; --fl-good1: #3987e5; --fl-good2: #3fae3f;
    --watch: #e3a33c; --danger: #ff6b72; --win: #5cc681;
    --lab: #8fbbe6; --lab-bg: #1a232d; --ph-bg: #2e2714; --ph-line: #6b5a24;
    --v2-bg: #0f1613; --v2-ink: #e6efe9; --v2-ink2: #a9bab1; --v2-acc: #5cc9a2; --v2-soft: #1c2c25; --v2-hot: #ff8a66; --v2-line: #2c3d35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --paper: #1c1919; --ink: #f2eeed; --ink-2: #c8c1c0; --muted: #958d8c;
  --rule: #d8d2d1; --hair: #3a3434; --panel: #262222; --pink: #4a2629; --red: #ff5c63;
  --band: #2c2727; --q: #5b5352; --med: #f2eeed;
    --fl-hard1: #e8455a; --fl-hard2: #c98500; --fl-hard3: #9085e9; --fl-hard4: #9040c0; --fl-good1: #3987e5; --fl-good2: #3fae3f;
  --watch: #e3a33c; --danger: #ff6b72; --win: #5cc681;
  --lab: #8fbbe6; --lab-bg: #1a232d; --ph-bg: #2e2714; --ph-line: #6b5a24;
  --v2-bg: #0f1613; --v2-ink: #e6efe9; --v2-ink2: #a9bab1; --v2-acc: #5cc9a2; --v2-soft: #1c2c25; --v2-hot: #ff8a66; --v2-line: #2c3d35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lab); outline-offset: 2px; }
.wrap { max-width: 1720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--paper); border-bottom: 2px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; }
.top .name { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1.5px solid var(--hair); background: transparent; border-radius: 999px; padding: 4px 13px; font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.ctl { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1.5px solid var(--lab); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--lab); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--lab); }
.seg button[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--lab); }

.review { border-bottom: 1.5px dashed var(--lab); background: var(--lab-bg); }
.review .wrap { padding-block: 14px 16px; display: grid; gap: 12px; }
.rtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.rtabs button { border: 1.5px solid var(--lab); background: var(--paper); color: var(--lab); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.rtabs button[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.rtabs .cnt { font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; margin-left: 4px; }
.rnote { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.rbody { display: grid; gap: 10px; max-width: 1100px; max-height: 48vh; overflow-y: auto; padding-right: 6px; }
.rbody h2 { font-family: var(--f-display); font-size: 20px; font-weight: 800; font-stretch: 85%; }
.rbody .lead { color: var(--ink-2); max-width: 75ch; }
.ritem { background: var(--paper); border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.ritem h3 { font-size: 16px; font-weight: 700; font-family: var(--f-body); }
.ritem .why { color: var(--ink-2); font-size: 14.5px; }
.ritem .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pill { border: 1.5px solid var(--lab); background: var(--paper); color: var(--lab); border-radius: 7px; padding: 2px 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.pill.veto[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
.pill .rec { font-weight: 600; font-size: 11.5px; font-family: var(--f-mono); margin-left: 4px; opacity: .85; }
.ritem.vetoed { border-color: var(--danger); }
.ritem.done { border-color: var(--win); }
.dbstate { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.notes { display: grid; gap: 6px; }
.nt { display: flex; gap: 8px; align-items: baseline; background: var(--panel); border-radius: 8px; padding: 5px 9px; font-size: 14px; }
.nt span { flex: 1; white-space: pre-wrap; }
.nt time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.nt button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.nadd { display: flex; gap: 6px; align-items: flex-end; }
.nadd textarea { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--hair); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; min-height: 34px; }
.nadd button { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--lab); background: var(--lab); color: var(--paper); cursor: pointer; }
.nadd .saved { align-self: center; font-size: 12px; font-weight: 700; color: var(--paper); background: var(--win); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.unsaved { font-size: 12.5px; font-weight: 600; color: var(--watch); }
.reply { font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--win); padding: 2px 0 2px 9px; }
.reply b { color: var(--win); }
.legacy { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
/* G5: notes open where the thing is; a dashed blue "lab" control, never page content */
.nbtn { border: 1px dashed var(--lab); background: var(--lab-bg); color: var(--lab); border-radius: 6px; padding: 0 7px; font-family: var(--f-body); font-weight: 700; font-size: 12px; line-height: 1.6; cursor: pointer; justify-self: start; white-space: nowrap; }
.nbtn[aria-expanded="true"] { background: var(--lab); color: var(--paper); }
.inote { border: 1px dashed var(--lab); background: var(--lab-bg); border-radius: 8px; padding: 6px 8px; display: grid; gap: 6px; font-family: var(--f-body); color: var(--ink); min-width: 0; grid-column: 1 / -1; }
.inote .nt { background: var(--paper); }
.nhook { display: flex; justify-content: flex-end; grid-column: 1 / -1; }
.jump { border: 0; background: none; padding: 0; color: var(--lab); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 13px; }
.tag.chk { border: 1px solid var(--hair); }
.tag.chk.hooked { background: color-mix(in srgb, var(--win) 12%, var(--paper)); color: var(--win); border-color: transparent; }
.tag.chk.not { background: color-mix(in srgb, var(--watch) 16%, var(--paper)); color: var(--watch); border-color: transparent; }
.hx7, .hfolds { display: grid; gap: 8px; min-width: 0; }
.hx7:empty { display: none; }
.hdef, .hrange, .hhalf { font-size: 15px; color: var(--ink-2); }
.hdef b, .hrange b, .hhalf b { color: var(--ink); }
.hstudies ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.mtable { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--paper); }
.mtable th, .mtable td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
.mtable th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mtable .gen { font-family: var(--f-mono); font-size: 11px; color: var(--lab); }
.mtable .em { color: var(--muted); font-style: italic; }
.mscroll { overflow-x: auto; border: 1px solid var(--hair); border-radius: 10px; }

.stage { padding-block: 18px 40px; }
.frames { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.fcol { display: grid; gap: 6px; min-width: 0; }
.fcol .flabel { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--lab); }
.fscroll { overflow-x: auto; max-width: 100%; }
.frame { background: var(--paper); box-shadow: 0 1px 0 var(--hair), 0 10px 30px rgba(0,0,0,.08); }
.frame.phone { width: 390px; border-radius: 22px; border: 8px solid var(--rule); overflow: hidden; }
.frame.wide { width: 1280px; border-radius: 6px; border: 1px solid var(--hair); }
.scaler { transform-origin: top left; }
@media (max-width: 520px) { .frames { display: block; } .fcol { width: 100%; } .fcol .flabel { padding-left: 16px; } .frame.phone { width: 100%; border-width: 0; border-radius: 0; box-shadow: none; } .stage .wrap { padding-left: 0; padding-right: 0; } }

body.reader .top, body.reader .review { display: none; }
body.reader .stage { padding: 0; }
body.reader .stage .wrap { max-width: none; padding: 0; }
body.reader .frames { display: block; }
body.reader .back { display: block; margin: 16px auto 24px; width: max-content; font-family: var(--f-mono); font-size: 11.5px; color: var(--lab); background: var(--lab-bg); border: 1px dashed var(--lab); border-radius: 6px; padding: 2px 8px; text-decoration: none; }
.top .rlink { font-family: var(--f-mono); font-size: 12px; color: var(--lab); }
/* ---------- the page (both versions) ---------- */
.page { container: page / inline-size; background: var(--paper); color: var(--ink); }
.page .sec { position: relative; }
.labbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border: 1px dashed var(--lab); background: var(--lab-bg); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; color: var(--ink); margin: 10px 16px 0; font-family: var(--f-body); }
.labbar-note { margin: 6px 16px 0; }
.labbar .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--lab); font-weight: 600; }
.labbar .seg button { padding: 1px 8px; font-size: 12.5px; }
.labbar .nb { border: 0; background: none; color: var(--lab); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 12.5px; padding: 0; }
.ref { border: 0; background: none; padding: 0 1px; cursor: pointer; color: var(--muted); font-family: var(--f-mono); font-size: .72em; vertical-align: super; line-height: 0; }
.ref:hover { color: var(--ink); }
details > summary { cursor: pointer; }
.hx .gapl { grid-column: 1 / -1; }
.gapl { font-size: 14px; color: var(--muted); font-style: italic; padding-top: 6px; }
.ph { border: 1.5px dashed var(--ph-line); background: var(--ph-bg); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); font-size: 14.5px; }
.ph .eyebrow { color: var(--watch); display: block; margin-bottom: 2px; }

/* ---------- version 1: his 2025 sheet, rulebook applied ---------- */
.v1 { font-family: var(--f-body); }
.v1 .blk { padding: 22px 16px; border-top: 2px solid var(--rule); display: grid; gap: 14px; }
.v1 .blk:first-of-type { border-top: 0; }
.v1 h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.v1 .hero { padding: 22px 16px 20px; display: grid; gap: 12px; }
.v1 .h-title { font-family: var(--f-display); font-weight: 900; font-stretch: 72%; font-size: 40px; line-height: .95; text-transform: uppercase; color: var(--red); }
.v1 .h-num { display: grid; gap: 6px; }
.v1 .h-num .big { font-family: var(--f-display); font-weight: 900; font-stretch: 68%; font-size: 104px; line-height: .86; letter-spacing: -.01em; }
.v1 .h-num .line { font-family: var(--f-display); font-weight: 700; font-stretch: 88%; font-size: 22px; line-height: 1.18; }
.v1 .h-side { display: grid; gap: 10px; align-content: end; }
.v1 .h-second { font-size: 16px; color: var(--ink-2); border-left: 3px solid var(--red); padding-left: 10px; }
.v1 .h-second b { font-family: var(--f-display); font-stretch: 80%; font-size: 19px; color: var(--ink); }
.cnt { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: var(--panel); color: var(--ink-2); }
.tag.off { background: color-mix(in srgb, var(--watch) 16%, var(--paper)); color: var(--watch); }
.tag.weak { background: color-mix(in srgb, var(--watch) 12%, var(--paper)); color: var(--watch); }
.tag.proj { background: var(--pink); color: var(--ink); }
.tag.prop { background: var(--lab-bg); color: var(--lab); border: 1px dashed var(--lab); }
.basis { font-size: 14px; color: var(--ink-2); display: grid; gap: 4px; }
.basis summary { color: var(--ink); font-weight: 600; font-size: 14px; }
.basis p { margin-top: 4px; }
.v1 .nrows { display: grid; }
.v1 .nrow { display: grid; gap: 6px; padding-block: 14px; border-top: 1px solid var(--hair); }
.v1 .nrow:first-child { border-top: 0; padding-top: 2px; }
.v1 .gtag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.v1 .mir { font-style: italic; color: var(--ink-2); }
.v1 .nr-main { display: grid; gap: 4px; }
.v1 .nrow .big { font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: 52px; line-height: .95; }
.v1 .nrow .hl { font-size: 17px; line-height: 1.38; font-weight: 600; }
.v1 .btable { display: grid; gap: 10px; }
.v1 .brow { display: grid; gap: 8px 12px; border: 2px solid var(--rule); padding: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "cur new" "proof proof" "test test"; }
.v1 .brow .cur { grid-area: cur; } .v1 .brow .new { grid-area: new; } .v1 .brow .bproof { grid-area: proof; } .v1 .brow .test { grid-area: test; }
.v1 .brow .bproof { font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--hair); padding-top: 6px; }
.v1 .bcell.cur p { font-size: 17px; }
.byline { font-size: 13.5px; color: var(--ink-2); }
.pcount { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
.ref { white-space: nowrap; line-height: 1; }   /* a wrapped [n] kept a zero-height line and sat on the chip below */
.cnt { margin-top: 2px; }
.pcount.off { color: var(--watch); }
.v1 a.tlink, .v2 a.tlink { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.hkey { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--v2-ink2); }
.hkey span { display: inline-flex; align-items: center; gap: 5px; }
.hkey i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--v2-acc); display: inline-block; }
.hkey i.f { background: var(--v2-acc); } .hkey i.p { border-style: dotted; } .hkey i.e { border-color: var(--v2-line); }
.v1 .bcell .bl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.v1 .bcell.cur p { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 19px; line-height: 1.2; }
.v1 .bcell.new p.t { font-weight: 700; color: var(--win); font-size: 17px; }
.v1 .bcell .proof { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.v1 .bcell.test p { font-size: 15.5px; }
.v1 .exlink { display: inline-flex; align-items: center; gap: 8px; justify-self: start; text-decoration: none; color: var(--paper); background: var(--ink); font-weight: 700; padding: 9px 14px; border-radius: 6px; }
.v1 .exlink:hover { background: var(--red); }
.v1 .plan { display: grid; gap: 0; border: 2px solid var(--rule); }
.v1 .pstep { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--rule); }
.v1 .pstep:first-child { border-top: 0; }
.v1 .pstep h3 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 19px; display: flex; gap: 10px; align-items: baseline; }
.v1 .pstep h3 i { font-style: normal; color: var(--red); font-size: 26px; font-stretch: 70%; }
.v1 .pstep .ptext { color: var(--ink-2); }
.v1 .pstep ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.v1 .pstep .pproof { font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--hair); padding-left: 8px; }
.v1 .gens { display: grid; gap: 12px; }
.v1 .gcard { background: var(--panel); padding: 12px; display: grid; gap: 6px; }
.v1 .gcard .big { font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: 44px; line-height: .95; }
.v1 .srcs ol { margin: 0; padding-left: 22px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.v1 .srcs .u { font-family: var(--f-mono); font-size: 11px; color: var(--watch); margin-left: 6px; }
.blk.foot { padding-block: 14px; }
.safety { font-size: 14px; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; }
.safety b { color: var(--danger); white-space: nowrap; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }

/* the felt-difficulty graph, shared by both versions; colours come from the version's tokens */
.felt { display: grid; gap: 10px; }

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KINDS = Object.fromEntries(DATA.kinds.kinds.map(k => [k.id, k]));
const GROUPS = DATA.kinds.groups;
const SECTIONS = [
  ["hero", "Hope number"], ["beliefs", "Beliefs"], ["graph", "How hard it feels"], ["quit", "Who gets free, and how"],
  ["outlook", "How quitting goes"], ["plan", "The plan"], ["general", "Every addiction"], ["story", "My experience"], ["footer", "Before you stop"], ["sources", "Sources"],
];
const VERSIONS = [["mix", "Your picks"], ["1", "1 · Best of what we have"], ["2", "2 · New take"]];
const st = { pilot: "alcohol", version: "mix", view: innerWidth >= 1250 ? "both" : innerWidth >= 900 ? "wide" : "phone", review: true, rtab: "choices" };
try { Object.assign(st, JSON.parse(localStorage.getItem("v3state") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("v3state", JSON.stringify(st)); } catch (e) {} };
const M = { veto: {}, choices: {}, picks: {}, kinds: {}, notes: {} };   // the marks store, mirrored

// ---------- shared helpers ----------
const choice = id => M.choices[id]?.pick || (DATA.decisions.choices.find(c => c.id === id) || {}).rec;
let page, shownRefs = null;
const fill = t => String(t).replace(/\{(\w+)\}/g, (m, k) => esc(page.subs[k] ?? m));
const refs = ns => ns && ns.length ? `<button type="button" class="ref" data-refs="${ns.join(",")}" aria-label="Source ${ns.join(", ")}">[${ns.join(",")}]</button>` : "";
function picked(kid) {
  const m = M.kinds[kid];
  return m && typeof m.pick === "boolean" ? m.pick : KINDS[kid].pick;
}
// round 7, G3: cards about people not checked for addiction stay on every page, each with a small tag saying who
// it is for ("Checked as hooked" / "Not checked for addiction"); the off-reader choice is gone (a decision now)
const OFFSEV = x => ["heavy", "users"].includes(x && x.severity);
const OFF = x => OFFSEV(x) || !!(x && x.propose) || /not checked|not required/i.test((x && x.counted) || "");   // E3
const dropOff = () => false;
// the data's own `checked` field wins; without it, the severity tag decides: people who only say they had or have
// a problem (resolved, self-hooked) and heavy or ordinary users were not checked; the other tags rest on criteria,
// a diagnosis for treatment, or a questionnaire (never by hand, rule 27 F2)
const checkedOf = x => x.checked === "hooked" || x.checked === "not" ? x.checked
  : (["heavy", "users", "resolved", "self-hooked"].includes(x.severity) || /not checked|not required/i.test(x.counted || "") ? "not" : "hooked");

async function connect() {

  if (!DB) { s.textContent = "Marks can’t be saved in this view (open the page on claude.ai while signed in)."; return; }

  let first = 0;
  const timer = setTimeout(() => { if (first < COLLS.length) s.textContent = "Can’t reach the marks store yet; your marks will show when it answers."; }, 10000);
  for (const c of COLLS) {
    let seen = false;
    DB.collection(c).onSnapshot(snap => {

      const prev = M[c];
      M[c] = Object.fromEntries(snap.docs.map(d => { const v = d.data(), k = fromId(c, d.id, v); return [k, c === "notes" && prev[k] && prev[k].draft && !v.draft ? { ...v, draft: prev[k].draft } : v]; }));
      if (!seen) { seen = true; first++; if (first === COLLS.length) { clearTimeout(timer); s.textContent = "Marks save as you click."; } }
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
      renderAll();
    }, () => { clearTimeout(timer); s.textContent = "The marks store stopped answering; reload the page."; });
  }
}

  try { await DB.collection(coll).doc(toId(coll, id)).set(M[coll][id]); $("#dbstate").textContent = "Saved."; if (coll === "notes") { SAVED.add(id); renderAll(); } return true; }
  catch (e) { $("#dbstate").textContent = "Not saved (" + (e.code || "error") + "). Try again."; if (coll === "notes") { SAVED.delete(id); renderAll(); } return false; }
}

  else if (t.dataset.inote) {
    // the box opens right at the item, in the frame that was clicked
    const k = t.dataset.inote, fr = t.closest(".frame"), which = fr && fr.classList.contains("wide") ? ".frame.wide" : ".frame.phone";
    if (OPEN.has(k) && !(M.notes[k]?.draft || "").trim()) OPEN.delete(k); else OPEN.add(k);
    renderAll();
    const ta = OPEN.has(k) && document.querySelector(`${which} [data-nka="${CSS.escape(k)}"] textarea`);
    if (ta) { ta.focus({ preventScroll: true }); ta.scrollIntoView({ block: "nearest" }); }
  }
  else if (t.dataset.jump) jumpTo(t.dataset.jump);
  else if (t.dataset.nadd) {
    const k = t.dataset.nadd, ta = t.closest(".notes").querySelector("textarea"), text = ta.value.trim();
    if (!text) return;
    const n = M.notes[k] || {};
    clearTimeout(draftTimer);
    put("notes", k, { notes: [...(n.notes || []), { text, t: new Date().toISOString() }], draft: "" });   // append, never overwrite
  }
  else if (t.dataset.ndel) {
    const k = t.dataset.ndel, n = M.notes[k] || {};
    put("notes", k, { notes: (n.notes || []).filter((_, i) => i !== +t.dataset.i) });
  }
});
let draftTimer;
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-nkey]"); if (!ta) return;
  const k = ta.dataset.nkey, box = ta.closest(".notes");
  M.notes[k] = { ...(M.notes[k] || {}), draft: ta.value };   // kept in this view at once, so a re-render never drops it
  SAVED.delete(k);
  const hint = box.querySelector(".unsaved"), badge = box.querySelector(".saved");
  if (hint) hint.hidden = !ta.value.trim();
  if (badge) badge.remove();
  if (!DB) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { DB.collection("notes").doc(toId("notes", k)).set({ ...(M.notes[k] || {}), key: k, draft: ta.value }).catch(() => {}); }, 1200);
});
// a Notes-tab link: open the page the note is on, then scroll its frame to the item and flash it
function jumpTo(k) {
  const pid = k.split("/")[0];
  if (DATA.pages.some(p => p.id === pid)) st.pilot = pid;
  st.review = true;
  renderAll();
  const el = document.querySelector(`#frames [data-nk="${CSS.escape(k)}"]`);
  if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.style.outline = "2px solid var(--lab)"; setTimeout(() => (el.style.outline = ""), 1800); }
}
connect();
function renderAll() { page = DATA.pages.find(p => p.id === st.pilot); renderTop(); if (readerMode()) { $("#review").hidden = true; renderFrames(); return; } if (typeof renderReview === "function" && st.review) renderReview(); renderFrames(); save(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.pilot) { st.pilot = t.dataset.pilot; renderAll(); }
  else if (t.dataset.ver) { st.version = t.dataset.ver; renderAll(); }
  else if (t.dataset.view) { st.view = t.dataset.view; renderAll(); }
  else if (t.dataset.rev) { st.review = t.dataset.rev === "on"; renderAll(); }
  else if (t.dataset.goto) {
    e.preventDefault();
    const el = (t.closest(".frame") || document).querySelector(`[data-anchor="${t.dataset.goto}"]`);
    if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  else if (t.dataset.refs) {
    const n = t.dataset.refs.split(",")[0];
    const frame = t.closest(".frame");
    const d = frame && frame.querySelector(".sec-sources details, .sec-sources");
    if (d && d.tagName === "DETAILS") d.open = true;
    const li = frame && frame.querySelector(`#src-${n}`);
    if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.style.background = "var(--pink)"; setTimeout(() => (li.style.background = ""), 1600); }
  }
});
renderAll();
</script>
