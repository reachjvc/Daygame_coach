<title>One-Pager Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:ital,wght@0,400..700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,400..800&display=swap">
<style>
/* v3 prototype. The shell (top bar, review panel) wraps one or two frames; each frame holds a .page that is a
   container, so the page itself lays out by its own width (phone 390 px, wide 1280 px) through container queries.
   Version 1 keeps the owner's 2025 sheet (ink, red, condensed Archivo). Version 2 is set on .page.v2. Review
   controls use the dashed blue "lab" style from round 3 so they never read as page content. */
:root {
  --bg: #e7e5e2; --paper: #ffffff; --ink: #161414; --ink-2: #4b4646; --muted: #6a6362;
  --rule: #1d1a1a; --hair: #d9d4d2; --panel: #f2f0ee; --pink: #f7d4d5; --red: #c8202a;
  --band: #ece8e4; --q: #b9b2ae; --med: #161414;
  --watch: #9a5500; --danger: #c41d2a; --win: #1c7a3c;
  --lab: #2f5f8f; --lab-bg: #eef3f8; --ph-bg: #fbf1d4; --ph-line: #e1cd8c;
  --v2-bg: #f4f6f3; --v2-ink: #10201a; --v2-ink2: #3e4d46; --v2-acc: #0d6b4f; --v2-soft: #dcebe3; --v2-hot: #b5482a; --v2-line: #c9d6cf;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-serif: "Fraunces", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --paper: #1c1919; --ink: #f2eeed; --ink-2: #c8c1c0; --muted: #958d8c;
    --rule: #d8d2d1; --hair: #3a3434; --panel: #262222; --pink: #4a2629; --red: #ff5c63;
    --band: #2c2727; --q: #5b5352; --med: #f2eeed;
    --watch: #e3a33c; --danger: #ff6b72; --win: #5cc681;
    --lab: #8fbbe6; --lab-bg: #1a232d; --ph-bg: #2e2714; --ph-line: #6b5a24;
    --v2-bg: #0f1613; --v2-ink: #e6efe9; --v2-ink2: #a9bab1; --v2-acc: #5cc9a2; --v2-soft: #1c2c25; --v2-hot: #ff8a66; --v2-line: #2c3d35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --paper: #1c1919; --ink: #f2eeed; --ink-2: #c8c1c0; --muted: #958d8c;
  --rule: #d8d2d1; --hair: #3a3434; --panel: #262222; --pink: #4a2629; --red: #ff5c63;
  --band: #2c2727; --q: #5b5352; --med: #f2eeed;
  --watch: #e3a33c; --danger: #ff6b72; --win: #5cc681;
  --lab: #8fbbe6; --lab-bg: #1a232d; --ph-bg: #2e2714; --ph-line: #6b5a24;
  --v2-bg: #0f1613; --v2-ink: #e6efe9; --v2-ink2: #a9bab1; --v2-acc: #5cc9a2; --v2-soft: #1c2c25; --v2-hot: #ff8a66; --v2-line: #2c3d35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lab); outline-offset: 2px; }
.wrap { max-width: 1720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--paper); border-bottom: 2px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; }
.top .name { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1.5px solid var(--hair); background: transparent; border-radius: 999px; padding: 4px 13px; font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.ctl { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1.5px solid var(--lab); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--lab); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--lab); }
.seg button[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--lab); }

.review { border-bottom: 1.5px dashed var(--lab); background: var(--lab-bg); }
.review .wrap { padding-block: 14px 16px; display: grid; gap: 12px; }
.rtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.rtabs button { border: 1.5px solid var(--lab); background: var(--paper); color: var(--lab); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.rtabs button[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.rtabs .cnt { font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; margin-left: 4px; }
.rbody { display: grid; gap: 10px; max-width: 1100px; max-height: 48vh; overflow-y: auto; padding-right: 6px; }
.rbody h2 { font-family: var(--f-display); font-size: 20px; font-weight: 800; font-stretch: 85%; }
.rbody .lead { color: var(--ink-2); max-width: 75ch; }
.ritem { background: var(--paper); border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.ritem h3 { font-size: 16px; font-weight: 700; font-family: var(--f-body); }
.ritem .why { color: var(--ink-2); font-size: 14.5px; }
.ritem .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pill { border: 1.5px solid var(--lab); background: var(--paper); color: var(--lab); border-radius: 7px; padding: 2px 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--lab); color: var(--paper); }
.pill.veto[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
.pill .rec { font-weight: 600; font-size: 11.5px; font-family: var(--f-mono); margin-left: 4px; opacity: .85; }
.ritem.vetoed { border-color: var(--danger); }
.ritem.done { border-color: var(--win); }
.dbstate { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.notes { display: grid; gap: 6px; }
.nt { display: flex; gap: 8px; align-items: baseline; background: var(--panel); border-radius: 8px; padding: 5px 9px; font-size: 14px; }
.nt span { flex: 1; white-space: pre-wrap; }
.nt time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.nt button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.nadd { display: flex; gap: 6px; align-items: flex-end; }
.nadd textarea { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--hair); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; min-height: 34px; }
.nadd button { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--lab); background: var(--lab); color: var(--paper); cursor: pointer; }
.mtable { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--paper); }
.mtable th, .mtable td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
.mtable th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mtable .gen { font-family: var(--f-mono); font-size: 11px; color: var(--lab); }
.mtable .em { color: var(--muted); font-style: italic; }
.mscroll { overflow-x: auto; border: 1px solid var(--hair); border-radius: 10px; }

.stage { padding-block: 18px 40px; }
.frames { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.fcol { display: grid; gap: 6px; min-width: 0; }
.fcol .flabel { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--lab); }
.fscroll { overflow-x: auto; max-width: 100%; }
.frame { background: var(--paper); box-shadow: 0 1px 0 var(--hair), 0 10px 30px rgba(0,0,0,.08); }
.frame.phone { width: 390px; border-radius: 22px; border: 8px solid var(--rule); overflow: hidden; }
.frame.wide { width: 1280px; border-radius: 6px; border: 1px solid var(--hair); }
.scaler { transform-origin: top left; }
@media (max-width: 520px) { .frames { display: block; } .fcol { width: 100%; } .fcol .flabel { padding-left: 16px; } .frame.phone { width: 100%; border-width: 0; border-radius: 0; box-shadow: none; } .stage .wrap { padding-left: 0; padding-right: 0; } }

body.reader .top, body.reader .review { display: none; }
body.reader .stage { padding: 0; }
body.reader .stage .wrap { max-width: none; padding: 0; }
body.reader .frames { display: block; }
body.reader .back { display: block; margin: 16px auto 24px; width: max-content; font-family: var(--f-mono); font-size: 11.5px; color: var(--lab); background: var(--lab-bg); border: 1px dashed var(--lab); border-radius: 6px; padding: 2px 8px; text-decoration: none; }
.top .rlink { font-family: var(--f-mono); font-size: 12px; color: var(--lab); }
/* ---------- the page (both versions) ---------- */
.page { container: page / inline-size; background: var(--paper); color: var(--ink); }
.page .sec { position: relative; }
.labbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border: 1px dashed var(--lab); background: var(--lab-bg); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; color: var(--ink); margin: 10px 16px 0; font-family: var(--f-body); }
.labbar .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--lab); font-weight: 600; }
.labbar .seg button { padding: 1px 8px; font-size: 12.5px; }
.labbar .nb { border: 0; background: none; color: var(--lab); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 12.5px; padding: 0; }
.ref { border: 0; background: none; padding: 0 1px; cursor: pointer; color: var(--muted); font-family: var(--f-mono); font-size: .72em; vertical-align: super; line-height: 0; }
.ref:hover { color: var(--ink); }
details > summary { cursor: pointer; }
.gapl { font-size: 14px; color: var(--muted); font-style: italic; padding-top: 6px; }
.ph { border: 1.5px dashed var(--ph-line); background: var(--ph-bg); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); font-size: 14.5px; }
.ph .eyebrow { color: var(--watch); display: block; margin-bottom: 2px; }

/* ---------- version 1: his 2025 sheet, rulebook applied ---------- */
.v1 { font-family: var(--f-body); }
.v1 .blk { padding: 22px 16px; border-top: 2px solid var(--rule); display: grid; gap: 14px; }
.v1 .blk:first-of-type { border-top: 0; }
.v1 h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.v1 .hero { padding: 22px 16px 20px; display: grid; gap: 12px; }
.v1 .h-title { font-family: var(--f-display); font-weight: 900; font-stretch: 72%; font-size: 40px; line-height: .95; text-transform: uppercase; color: var(--red); }
.v1 .h-num { display: grid; gap: 6px; }
.v1 .h-num .big { font-family: var(--f-display); font-weight: 900; font-stretch: 68%; font-size: 104px; line-height: .86; letter-spacing: -.01em; }
.v1 .h-num .line { font-family: var(--f-display); font-weight: 700; font-stretch: 88%; font-size: 22px; line-height: 1.18; }
.v1 .h-side { display: grid; gap: 10px; align-content: end; }
.v1 .h-second { font-size: 16px; color: var(--ink-2); border-left: 3px solid var(--red); padding-left: 10px; }
.v1 .h-second b { font-family: var(--f-display); font-stretch: 80%; font-size: 19px; color: var(--ink); }
.cnt { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; font-size: 12.5px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: var(--panel); color: var(--ink-2); }
.tag.off { background: color-mix(in srgb, var(--watch) 16%, var(--paper)); color: var(--watch); }
.tag.weak { background: color-mix(in srgb, var(--watch) 12%, var(--paper)); color: var(--watch); }
.tag.proj { background: var(--pink); color: var(--ink); }
.tag.prop { background: var(--lab-bg); color: var(--lab); border: 1px dashed var(--lab); }
.basis { font-size: 14px; color: var(--ink-2); display: grid; gap: 4px; }
.basis summary { color: var(--ink); font-weight: 600; font-size: 14px; }
.basis p { margin-top: 4px; }
.v1 .nrows { display: grid; }
.v1 .nrow { display: grid; gap: 6px; padding-block: 14px; border-top: 1px solid var(--hair); }
.v1 .nrow:first-child { border-top: 0; padding-top: 2px; }
.v1 .gtag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.v1 .mir { font-style: italic; color: var(--ink-2); }
.v1 .nr-main { display: grid; gap: 4px; }
.v1 .nrow .big { font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: 52px; line-height: .95; }
.v1 .nrow .hl { font-size: 17px; line-height: 1.38; font-weight: 600; }
.v1 .btable { display: grid; gap: 10px; }
.v1 .brow { display: grid; gap: 8px; border: 2px solid var(--rule); padding: 12px; }
.v1 .bcell .bl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.v1 .bcell.cur p { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 19px; line-height: 1.2; }
.v1 .bcell.new p.t { font-weight: 700; color: var(--win); font-size: 17px; }
.v1 .bcell .proof { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.v1 .bcell.test p { font-size: 15.5px; }
.v1 .exlink { display: inline-flex; align-items: center; gap: 8px; justify-self: start; text-decoration: none; color: var(--paper); background: var(--ink); font-weight: 700; padding: 9px 14px; border-radius: 6px; }
.v1 .exlink:hover { background: var(--red); }
.v1 .plan { display: grid; gap: 0; border: 2px solid var(--rule); }
.v1 .pstep { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--rule); }
.v1 .pstep:first-child { border-top: 0; }
.v1 .pstep h3 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 19px; display: flex; gap: 10px; align-items: baseline; }
.v1 .pstep h3 i { font-style: normal; color: var(--red); font-size: 26px; font-stretch: 70%; }
.v1 .pstep .ptext { color: var(--ink-2); }
.v1 .pstep ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.v1 .pstep .pproof { font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--hair); padding-left: 8px; }
.v1 .gens { display: grid; gap: 12px; }
.v1 .gcard { background: var(--panel); padding: 12px; display: grid; gap: 6px; }
.v1 .gcard .big { font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: 44px; line-height: .95; }
.v1 .srcs ol { margin: 0; padding-left: 22px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.v1 .srcs .u { font-family: var(--f-mono); font-size: 11px; color: var(--watch); margin-left: 6px; }
.blk.foot { padding-block: 14px; }
.safety { font-size: 14px; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; }
.safety b { color: var(--danger); white-space: nowrap; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }

/* the felt-difficulty graph, shared by both versions; colours come from the version's tokens */
.felt { display: grid; gap: 10px; }
.felt .peaks { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.felt .peaks div { display: grid; }
.felt .peaks b { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 30px; line-height: 1; }
.felt .peaks span { font-size: 13.5px; color: var(--ink-2); }
.fv { display: grid; gap: 4px; }
.fv svg { width: 100%; height: auto; display: block; overflow: visible; }
.fv .lbl { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.fv .lbl.k { fill: var(--ink); font-weight: 600; }
.legendl { font-size: 12px; color: var(--muted); }
.fv .r { display: grid; grid-template-columns: 74px minmax(0, 1fr) 34px; align-items: center; gap: 8px; font-size: 13px; }
.fv .r .d { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.fv .r .n { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: right; }
.fv .bar { position: relative; height: 18px; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--hair) calc(10% - 1px) 10%); }
.fv .iqr { position: absolute; top: 4px; bottom: 4px; background: var(--q); border-radius: 3px; }
.fv .md { position: absolute; top: 1px; width: 4px; margin-left: -2px; bottom: 1px; background: var(--med); border-radius: 2px; }
.fv .r.thin .iqr { opacity: .45; }
.fv .r.peak .d, .fv .r.ease .d { color: var(--ink); font-weight: 600; }
.fv .axis { display: grid; grid-template-columns: 74px minmax(0, 1fr) 34px; gap: 8px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.fv .axis .ticks { position: relative; height: 14px; }
.fv .axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.fv .axis .ticks span:first-child { transform: none; }
.fv .axis .ticks span:last-child { transform: translateX(-100%); }
.fv .r.hd { font-size: 10.5px; }
.fv .r.thin .d::after { content: " · few"; color: var(--muted); }
.fh { display: none; }
.fh svg { width: 100%; height: auto; display: block; overflow: visible; }
.fh .lbl { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.fh .lbl.k { fill: var(--ink); font-weight: 600; }
.appc { display: grid; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--hair); }
.appbars { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; height: 110px; max-width: 640px; }
.appbars .yax { display: flex; flex-direction: column; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: right; }
.appbars .bars { display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--hair); background: linear-gradient(var(--hair) 1px, transparent 1px) 0 0 / 100% 20%; }
.appbars .bars i { flex: 1; background: var(--med); border-radius: 2px 2px 0 0; min-height: 1px; }
.appx { display: flex; justify-content: space-between; max-width: 640px; padding-left: 40px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.body-rows { display: grid; gap: 6px; }
.body-rows .br { display: grid; gap: 1px; font-size: 14.5px; padding-left: 10px; border-left: 3px solid var(--hair); }
.body-rows .br.danger { border-left-color: var(--danger); }
.body-rows .br.trigger { border-left-style: dashed; }
.body-rows .br .w { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.body-rows .br.danger .w { color: var(--danger); }
.stages { display: grid; gap: 6px; }
.stages h3 { grid-column: 1 / -1; }
.nw { white-space: nowrap; }
.stages .st { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.stages .st b { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); font-weight: 600; padding-top: 2px; }
.cap { font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.scored { font-size: 13px; color: var(--muted); }
.cap summary { font-weight: 600; color: var(--ink); }
.cap ul { margin: 4px 0 0; padding-left: 18px; }

@container page (min-width: 760px) {
  .v1 .blk, .v1 .hero { padding: 30px 40px; }

    const n = hist.reduce((a, b) => a + b, 0);
    const vals = [];
    hist.forEach((c, k) => { for (let j = 0; j < c; j++) vals.push(k); });
    const dots = n >= 20 ? Array.from({ length: 20 }, (_, i) => vals[Math.min(n - 1, Math.floor((i + .5) / 20 * n))]) : null;

      <div class="ffoot">${xs.map(x => `<details class="basis"><summary>${esc(x.big)}: based on</summary><p>${esc([x.basis.design, x.basis.n].join(" · "))}</p><p><b>What it doesn’t mean:</b> ${esc(x.caveat)}</p></details>`).join("")}</div></div></div>`;
  },
  story() { return V1.story(); },
  sources() { return V1.sources(); },
};
function hx(title, xs) {
  if (!xs.length) return "";
  return `<div class="blk"><h2>${esc(title)}</h2><div class="hx">${xs.map(x => `<div class="hxr">
    ${x.mirror && choice("mirror") !== "drop" ? `<p class="mir">${esc(x.mirror)}</p>` : ""}<div class="top"><span class="big">${esc(x.big)}</span>${g10(shareOf(x.big))}</div>
    <p class="hl">${esc(x.headline)} ${refs(x.n)}</p>${tags(x)}${basis(x)}</div>`).join("")}</div>${gapLine(title === "How quitting goes" ? "outlook" : "more")}</div>`;
}

// ---------- render ----------
const R = { "1": V1, "2": typeof V2 !== "undefined" ? V2 : V1 };
function verOf(sec) {
  if (st.version !== "mix") return st.version;
  return String(M.picks[sec]?.v || (DATA.decisions.recPicks || {})[sec] || "1");
}
function labbar(sec, name) {
  if (!st.review) return "";
  const p = String(M.picks[sec]?.v || (DATA.decisions.recPicks || {})[sec] || "1");
  const nn = (M.notes["sec-" + sec]?.notes || []).length;
  return `<div class="labbar"><span class="lbl">${esc(name)}</span><span>Use on every page:</span><span class="seg">${["1", "2"].map(v => `<button type="button" data-pick="${sec}" data-v="${v}" aria-pressed="${p === v}">v${v}</button>`).join("")}</span><button type="button" class="nb" data-note="sec-${sec}">${nn ? `Notes (${nn})` : "Add a note"}</button></div>`;
}
function renderPage(frameKind) {
  page = DATA.pages.find(p => p.id === st.pilot);
  const out = [];
  let order = SECTIONS;
  if (choice("planplace") === "early") order = [...SECTIONS.slice(0, 3), SECTIONS[5], SECTIONS[3], SECTIONS[4], ...SECTIONS.slice(6)];
  shownRefs = new Set();
  for (const [sec, name] of order) {
    const v = verOf(sec);
    if (sec === "sources") { out.push({ sec, name, v }); continue; }
    const html = (R[v][sec] || V1[sec])();
    if (!html) continue;
    for (const m of html.matchAll(/data-refs="([\d,]+)"/g)) m[1].split(",").forEach(n => shownRefs.add(+n));
    out.push(`<section class="sec sec-${sec} v${v}" data-sec="${sec}">${labbar(sec, name)}${html}</section>`);
  }
  (page.footer?.n || []).forEach(n => shownRefs.add(n));
  const si = out.findIndex(x => typeof x === "object");
  if (si >= 0) { const { sec, name, v } = out[si]; out[si] = `<section class="sec sec-${sec} v${v}" data-sec="${sec}">${labbar(sec, name)}${(R[v][sec] || V1[sec])()}</section>`; }
  return `<article class="page v${st.version === "mix" ? "mix" : st.version}">${out.join("")}</article>`;
}
function readerMode() {
  const m = location.hash.match(/^#read-(alcohol|nicotine|cannabis|porn)-(1|2|mix)$/);
  return m ? { pilot: m[1], version: m[2] } : null;
}
function renderFrames() {
  const box = $("#frames");
  const rm = readerMode();
  document.body.classList.toggle("reader", !!rm);
  if (rm) {
    const keep = { pilot: st.pilot, version: st.version, review: st.review };
    Object.assign(st, { pilot: rm.pilot, version: rm.version, review: false });
    page = DATA.pages.find(p => p.id === st.pilot);
    box.innerHTML = `${renderPage("reader")}<a class="back" href="#">← Back to the review page</a>`;
    Object.assign(st, keep);
    return;
  }
  const ph = `<div class="fcol"><span class="flabel">Phone · 390 px</span><div class="frame phone">${renderPage("phone")}</div></div>`;
  const wd = `<div class="fcol"><span class="flabel">Wide · 1280 px</span><div class="fscroll"><div class="scaler"><div class="frame wide">${renderPage("wide")}</div></div></div></div>`;
  box.innerHTML = st.view === "phone" ? ph : st.view === "wide" ? wd : ph + wd;
  fitWide();
}
function fitWide() {
  const sc = $(".scaler"); if (!sc) return;
  const col = sc.parentElement;
  const avail = st.view === "both" ? $("#frames").clientWidth - 390 - 24 - 16 : $("#frames").clientWidth;
  const k = Math.min(1, Math.max(.3, avail / 1280));
  sc.style.transform = k < 1 ? `scale(${k})` : "";
  sc.style.width = "1280px";
  col.style.width = Math.round(1280 * k) + "px";
  col.style.height = Math.round(sc.firstElementChild.offsetHeight * k) + "px";
}
addEventListener("resize", () => fitWide());
addEventListener("hashchange", () => renderAll());

function renderTop() {
  $("#tabs").innerHTML = DATA.pages.map(p => `<button type="button" class="tab" data-pilot="${p.id}" aria-pressed="${p.id === st.pilot}">${esc(p.tab)}</button>`).join("");
  $("#segV").innerHTML = VERSIONS.map(([v, l]) => `<button type="button" data-ver="${v}" aria-pressed="${st.version === v}">${esc(l)}</button>`).join("");
  $("#segW").innerHTML = [["phone", "Phone"], ["wide", "Wide"], ["both", "Both"]].map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${st.view === v}">${l}</button>`).join("");
  $("#segR").innerHTML = [["on", "On"], ["off", "Off"]].map(([v, l]) => `<button type="button" data-rev="${v}" aria-pressed="${(st.review ? "on" : "off") === v}">${l}</button>`).join("");
  $("#review").hidden = !st.review;
  const rl = $("#rlink"); if (rl) rl.href = `#read-${st.pilot}-${st.version}`;
}
// ---------- review panel ----------
const D = DATA.decisions;
const RTABS = [["choices", "Choices for you", () => D.choices.length], ["decisions", "Decisions I took", () => D.decisions.length], ["weak", "What is weak", () => (D.weak || []).length], ["menu", "Number menu", () => DATA.kinds.kinds.length], ["graph", "How the graph was made", null], ["kept", "Left untouched", null], ["left", "Not on the pages", () => DATA.pages.reduce((n, p) => n + leftItems(p).length, 0)], ["notes", "Notes", () => Object.values(M.notes).reduce((a, n) => a + (n.notes || []).length, 0)]];
function leftItems(p0) {
  const p = p0 || page || DATA.pages.find(x => x.id === st.pilot), out = [];
  const nu = p.notUsed || {};
  const lab = x => typeof x === "string" ? x : x.big ? `${x.big}${x.headline ? ": " + x.headline : x.line ? ": " + x.line : ""}` : x.limiting || x.current || x.text || x.from || x.label || JSON.stringify(x).slice(0, 120);
  const why = x => typeof x === "string" ? "" : x.reason || x.why || (x.rejectedBy && [].concat(x.rejectedBy.why || []).join(" ")) || x.note || "";
  for (const x of [].concat(nu.numbers || [])) out.push({ kind: "Number from version 10", label: lab(x), why: why(x) });
  for (const x of [].concat(nu.beliefs || [])) out.push({ kind: "Belief from version 10", label: lab(x), why: why(x) });
  for (const x of [].concat(nu.milestones || [])) out.push({ kind: "Milestone from round 2", label: lab(x), why: why(x) });
  for (const x of [].concat(p.rejected || [])) out.push({ kind: "Turned down by a checker", label: lab(x), why: why(x) });
  return out;
}
function noteBox(key) {
  const n = M.notes[key] || {};
  return `<div class="notes" data-key="${esc(key)}">${(n.notes || []).map((x, i) => `<div class="nt"><span>${esc(x.text)}</span><time>${esc((x.t || "").slice(5, 16).replace("T", " "))}</time><button type="button" data-ndel="${esc(key)}" data-i="${i}" aria-label="Delete note">×</button></div>`).join("")}
    <div class="nadd"><textarea id="nt-${esc(key)}" rows="1" placeholder="Add a note">${esc(n.draft || "")}</textarea><button type="button" data-nadd="${esc(key)}">Add</button></div></div>`;
}
function renderReview() {
  $("#rtabs").innerHTML = RTABS.map(([k, l, c]) => `<button type="button" data-rtab="${k}" aria-pressed="${st.rtab === k}">${esc(l)}${c ? `<span class="cnt">${c()}</span>` : ""}</button>`).join("");
  const b = $("#rbody");
  if (st.rtab === "choices") {
    b.innerHTML = `<h2>Up to 7 choices. Each one becomes a rule for every page.</h2><div class="lead">The prototype already uses my recommendation for each. Pick another and every page changes at once. You won’t be asked these again.</div>` +
      D.choices.map(c => { const cur = M.choices[c.id]?.pick; return `<div class="ritem${cur ? " done" : ""}"><h3>${esc(c.rule)}</h3><p class="why">${esc(c.why)}</p><div class="row">${c.options.map(o => `<button type="button" class="pill" data-choice="${c.id}" data-o="${o.id}" aria-pressed="${(cur || "") === o.id}">${esc(o.label)}${o.id === c.rec ? `<span class="rec">recommended</span>` : ""}</button>`).join("")}</div>${noteBox("ch-" + c.id)}</div>`; }).join("");
  } else if (st.rtab === "decisions") {
    b.innerHTML = `<h2>Decisions I took, each with its reason</h2><div class="lead">Veto any of them and say why; I’ll change it on every page.</div>` +
      D.decisions.map(d => { const v = M.veto[d.id]?.v; return `<div class="ritem${v === "veto" ? " vetoed" : v === "ok" ? " done" : ""}"><h3>${esc(d.title)}</h3><p>${esc(d.decision)}</p><p class="why">Why: ${esc(d.why)}</p><div class="row"><button type="button" class="pill" data-veto="${d.id}" data-v="ok" aria-pressed="${v === "ok"}">Keep</button><button type="button" class="pill veto" data-veto="${d.id}" data-v="veto" aria-pressed="${v === "veto"}">Veto</button></div>${v === "veto" || (M.notes["dec-" + d.id]?.notes || []).length ? noteBox("dec-" + d.id) : ""}</div>`; }).join("");
  } else if (st.rtab === "weak") {
    b.innerHTML = `<h2>What is weak</h2><div class="lead">Where the data is thin or I am unsure. These are on the pages too, marked “Weak”.</div>` + (D.weak || []).map(w => `<div class="ritem"><h3>${esc(w.title)}</h3><p class="why">${esc(w.text)}</p></div>`).join("");
  } else if (st.rtab === "menu") {
    const rows = [];
    for (const [gid, gname] of Object.entries(GROUPS)) {
      for (const k of DATA.kinds.kinds.filter(k => k.group === gid)) {
        const xs = k.scope === "general" ? DATA.general.numbers.filter(x => x.kind === k.id) : (page.numbers || []).filter(x => x.kind === k.id);
        const on = picked(k.id);
        rows.push(`<tr><td>${esc(gname)}</td><td><b>${esc(k.label)}</b>${k.scope === "general" ? ` <span class="gen">general</span>` : ""}<br><span class="em">${esc(k.question)}</span></td><td>${xs.length ? xs.map(x => `<b>${esc(x.big)}</b> ${esc(x.headline)}`).join("<br>") : `<span class="em">Empty: ${esc((k.scope === "general" ? "" : gapFor(k.id)))}</span>`}</td><td><button type="button" class="pill" data-kind="${k.id}" aria-pressed="${on}">${on ? "On every page" : "Off"}</button>${k.pick ? `<span class="rec" style="display:block;color:var(--muted);font-size:11px">my pick</span>` : ""}</td></tr>`);
      }
    }
    b.innerHTML = `<h2>Number menu: ${esc(page.tab)}</h2><div class="lead">Every kind of number, with what this page has for it. Switching a kind on or off changes every page. Switch tabs at the top to see another addiction’s numbers.</div><div class="mscroll"><table class="mtable"><thead><tr><th>Group</th><th>Kind</th><th>This page’s number</th><th>Show</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  } else if (st.rtab === "graph") {
    b.innerHTML = (D.graph || []).map(g => `<div class="ritem"><h3>${esc(g.title)}</h3>${g.text.map(t => `<p class="why">${esc(t)}</p>`).join("")}</div>`).join("") +
      `<div class="ritem"><h3>Per page</h3><div class="mscroll"><table class="mtable"><thead><tr><th>Page</th><th>Forum</th><th>Posts read</th><th>Used</th><th>Second reader within 1 point</th><th>Other model within 1 point</th></tr></thead><tbody>${DATA.pages.map(p => p.felt ? `<tr><td>${esc(p.tab)}</td><td>${esc(p.felt.forums.join(", "))}</td><td>${p.felt.nSampled}</td><td>${p.felt.nUsed}</td><td>${Math.round(p.felt.agreement.within1 * 100)}% of ${p.felt.agreement.nBothScored}</td><td>${p.felt.agreementCross ? `${Math.round(p.felt.agreementCross.within1 * 100)}% of ${p.felt.agreementCross.nBothScored}` : "–"}</td></tr>` : "").join("")}</tbody></table></div></div>`;
  } else if (st.rtab === "left") {
    const all = DATA.pages.flatMap(p => leftItems(p).map(x => ({ ...x, tab: p.tab })));
    const groups = {};
    for (const x of all) (groups[x.kind] = groups[x.kind] || []).push(x);
    b.innerHTML = `<h2>Not on the pages, all four together</h2><div class="lead">Nothing here is deleted. One list for every page, grouped by why it is not shown. Say in a note if a group, or one item, should come back; it then comes back on every page where it fits.</div>` +
      Object.entries(groups).map(([k, xs]) => `<div class="ritem"><h3>${esc(k)} (${xs.length})</h3><details><summary>Show them</summary>${xs.map(x => `<p><b>${esc(x.tab)}:</b> ${esc(x.label)}${x.why ? ` <span class="why">${esc(x.why)}</span>` : ""}</p>`).join("")}</details></div>`).join("") + noteBox("left-all");
  } else if (st.rtab === "left-old") {
    const xs = leftItems();
    b.innerHTML = `<h2>Not on this page: ${esc(page.tab)}</h2><div class="lead">Nothing here is deleted. These are version 10 numbers and beliefs this page doesn’t show, and candidates a checker turned down, each with the reason. Say in a note if one should come back; it then comes back on every page where it fits.</div>` +
      (xs.length ? xs.map(x => `<div class="ritem"><span class="eyebrow">${esc(x.kind)}</span><p>${esc(x.label)}</p>${x.why ? `<p class="why">${esc(x.why)}</p>` : ""}</div>`).join("") : `<div class="ritem"><p>Nothing left off.</p></div>`) + noteBox("left-" + page.id);
  } else if (st.rtab === "kept") {
    b.innerHTML = `<h2>Left untouched</h2>` + (D.kept || []).map(k => `<div class="ritem"><p>${esc(k)}</p></div>`).join("");
  } else {
    const keys = ["general", ...SECTIONS.map(([s]) => "sec-" + s)];
    b.innerHTML = `<h2>Notes</h2><div class="lead">Anything you want changed. A note on a section applies to that section on every page.</div>` + keys.map(k => `<div class="ritem"><h3>${esc(k === "general" ? "General" : SECTIONS.find(([s]) => "sec-" + s === k)[1])}</h3>${noteBox(k)}</div>`).join("");
  }
}

// ---------- marks store ----------
let DB = null;
const COLLS = ["veto", "choices", "picks", "kinds", "notes"];
async function connect() {
  const s = $("#dbstate");
  try {
    DB = await window.claude?.use?.("db");
  } catch (e) { DB = null; }
  if (!DB) { s.textContent = "Marks can’t be saved in this view (open the page on claude.ai while signed in)."; return; }
  s.textContent = "Loading your marks…";
  let first = 0;
  const timer = setTimeout(() => { if (first < COLLS.length) s.textContent = "Can’t reach the marks store yet; your marks will show when it answers."; }, 10000);
  for (const c of COLLS) {
    let seen = false;
    DB.collection(c).onSnapshot(snap => {
      M[c] = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      if (!seen) { seen = true; first++; if (first === COLLS.length) { clearTimeout(timer); s.textContent = "Marks save as you click."; } }
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
      renderAll();
    }, () => { clearTimeout(timer); s.textContent = "The marks store stopped answering; reload the page."; });
  }
}
async function put(coll, id, data) {
  if (!DB) { $("#dbstate").textContent = "Not saved: no marks store in this view."; return; }
  M[coll][id] = { ...(M[coll][id] || {}), ...data, t: new Date().toISOString() };
  renderAll();
  try { await DB.collection(coll).doc(id).set(M[coll][id]); $("#dbstate").textContent = "Saved."; }
  catch (e) { $("#dbstate").textContent = "Not saved (" + (e.code || "error") + "). Try again."; }
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.rtab) { st.rtab = t.dataset.rtab; renderAll(); }
  else if (t.dataset.choice) put("choices", t.dataset.choice, { pick: t.dataset.o });
  else if (t.dataset.veto) put("veto", t.dataset.veto, { v: t.dataset.v });
  else if (t.dataset.pick) put("picks", t.dataset.pick, { v: t.dataset.v });
  else if (t.dataset.kind) put("kinds", t.dataset.kind, { pick: !picked(t.dataset.kind) });
  else if (t.dataset.note) { st.review = true; st.rtab = "notes"; renderAll(); const el = document.getElementById("nt-" + t.dataset.note); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } }
  else if (t.dataset.nadd) {
    const k = t.dataset.nadd, ta = document.getElementById("nt-" + k), text = ta.value.trim();
    if (!text) return;
    const n = M.notes[k] || {};
    put("notes", k, { notes: [...(n.notes || []), { text, t: new Date().toISOString() }], draft: "" });
  }
  else if (t.dataset.ndel) {
    const k = t.dataset.ndel, n = M.notes[k] || {};
    put("notes", k, { notes: (n.notes || []).filter((_, i) => i !== +t.dataset.i) });
  }
});
let draftTimer;
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[id^='nt-']"); if (!ta || !DB) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { const k = ta.id.slice(3); DB.collection("notes").doc(k).set({ ...(M.notes[k] || {}), draft: ta.value }).catch(() => {}); }, 1200);
});
connect();
function renderAll() { page = DATA.pages.find(p => p.id === st.pilot); renderTop(); if (readerMode()) { $("#review").hidden = true; renderFrames(); return; } if (typeof renderReview === "function" && st.review) renderReview(); renderFrames(); save(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.pilot) { st.pilot = t.dataset.pilot; renderAll(); }
  else if (t.dataset.ver) { st.version = t.dataset.ver; renderAll(); }
  else if (t.dataset.view) { st.view = t.dataset.view; renderAll(); }
  else if (t.dataset.rev) { st.review = t.dataset.rev === "on"; renderAll(); }
  else if (t.dataset.refs) {
    const n = t.dataset.refs.split(",")[0];
    const frame = t.closest(".frame");
    const d = frame && frame.querySelector(".sec-sources details, .sec-sources");
    if (d && d.tagName === "DETAILS") d.open = true;
    const li = frame && frame.querySelector(`#src-${n}`);
    if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.style.background = "var(--pink)"; setTimeout(() => (li.style.background = ""), 1600); }
  }
});
renderAll();
</script>
