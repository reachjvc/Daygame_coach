name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type errors may only go down: fails on any file whose count rose above
      # tsc-baseline.json. The build itself ignores type errors (next.config.mjs),
      # so without this nothing anywhere would type-check.
      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs

      - name: Unit tests
        run: npm test
