name: CI

# Every branch, not only main and beta. A working branch that is never checked
# is the whole problem: this one carried 23 commits without a single green or
# red tick, because the workflow only fired for two branch names.
# workflow_dispatch is the "run it now" button, for when a check has to be
# repeated without pushing anything.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

# The token's rights are stated here, not left to a repository setting. Jobs
# that publish ask for exactly what they need, and nothing else gets more.
permissions:
  contents: read

# A newer push to the same branch stops the older run: its answer is about a
# commit nobody is looking at any more, and without this the older run can
# finish last and paint the branch with a stale result. main is the exception:
# a production run may sit waiting for the owner's approval, so runs on main
# get a group of their own and never cancel or queue each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19, and browser dependencies and Docker on a new OS release are
    # what break first. Moving to 26.04 is a deliberate change for later.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the secret scan reads every commit, and the
          # dependency audit compares with the lockfile its baseline was
          # written from.
          fetch-depth: 0

      # This repository is public, so a pushed secret is published at once.
      # .husky/pre-push scans the commits being pushed before they leave the
      # machine; this scans the whole history again, for pushes made without
      # the hook. Known non-secrets: .gitleaksignore. The checksum is pinned
      # here, not read from the release, so a replaced release fails.
      - name: Secret scan
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint errors may only go down, the same bargain as the type ratchet
      # below. A bare `eslint .` failed here for days on 492 pre-existing
      # errors, which trains everyone to ignore a red tick; 140 of those turned
      # out to be eslint configuration rather than code. See
      # scripts/lint-ratchet.mjs.
      - name: Lint ratchet
        run: npm run lint:ratchet

      # Type errors may only go down: fails on any file whose count rose above
      # tsc-baseline.json. The build itself ignores type errors (next.config.mjs),
      # so without this nothing anywhere would type-check.
      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs

      # Fails when the lockfile brings in a version with a known advisory, or
      # when anything that ships has a critical one. An advisory published
      # overnight against an unchanged version only warns, in the run summary.
      # See scripts/audit-ratchet.mjs.
      - name: Dependency audit ratchet
        run: npm run audit:ratchet

      - name: Unit tests
        run: npm test

      # The database tests run against a throwaway local Supabase built from
      # production's own schema (scripts/db/test-stack.mjs; tests/db/) — row
      # security, the finish function, the signup trigger, and the app's repos
      # through real PostgREST. They had never run anywhere but a laptop, so
      # nothing stopped a schema rule from being wrong for weeks. GitHub's
      # ubuntu runners ship Docker; the CLI that starts the stack comes from
      # here, pinned to SUPABASE_CLI_VERSION in scripts/db/test-stack.mjs
      # (tests/unit/ciWorkflows.test.ts fails if the two disagree).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Database tests
        run: npm run test:integration
        timeout-minutes: 15
