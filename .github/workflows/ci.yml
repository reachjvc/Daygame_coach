name: CI

# Every branch, not only main and beta. A working branch that is never checked
# is the whole problem: this one carried 23 commits without a single green or
# red tick, because the workflow only fired for two branch names.
# workflow_dispatch is the "run it now" button, for when a check has to be
# repeated without pushing anything.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

# The token's rights are stated here, not left to a repository setting. Jobs
# that publish ask for exactly what they need, and nothing else gets more.
permissions:
  contents: read

# A newer push to the same branch stops the older run: its answer is about a
# commit nobody is looking at any more, and without this the older run can
# finish last and paint the branch with a stale result. main is the exception:
# a production run may sit waiting for the owner's approval, so runs on main
# get a group of their own and never cancel or queue each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19, and browser dependencies and Docker on a new OS release are
    # what break first. Moving to 26.04 is a deliberate change for later.
    runs-on: ubuntu-24.04
    steps:
      # FIRST, BEFORE ANYTHING TOUCHES THE NETWORK. The test backend's ports
      # (55320-55329, tests/db/supabase/config.toml) sit inside Linux's
      # ephemeral range, so any outbound connection — checkout, npm ci, the
      # browser and image downloads — can take one, and holds it while open
      # and for a minute after it closes. Run 38731303670 lost a shard to
      # "0.0.0.0:55324 ... address already in use"; reserving the range after
      # npm ci was too late (run 38858666954, 55322). Reserved first, the
      # kernel never hands them out. ciWorkflows.test.ts keeps the range in
      # step with config.toml and this step first.
      - name: Keep the test backend's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329

      - uses: actions/checkout@v7
        with:
          # The whole history: the secret scan reads every commit, and the
          # dependency audit compares with the lockfile its baseline was
          # written from.
          fetch-depth: 0

      # This repository is public, so a pushed secret is published at once.
      # .husky/pre-push scans the commits being pushed before they leave the
      # machine; this scans the whole history again, for pushes made without
      # the hook. Known non-secrets: .gitleaksignore. The checksum is pinned
      # here, not read from the release, so a replaced release fails.
      - name: Secret scan
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint errors may only go down, the same bargain as the type ratchet
      # below. A bare `eslint .` failed here for days on 492 pre-existing
      # errors, which trains everyone to ignore a red tick; 140 of those turned
      # out to be eslint configuration rather than code. See
      # scripts/lint-ratchet.mjs.
      - name: Lint ratchet
        run: npm run lint:ratchet

      # Type errors may only go down: fails on any file whose count rose above
      # tsc-baseline.json. The build itself ignores type errors (next.config.mjs),
      # so without this nothing anywhere would type-check.
      - name: Type-check ratchet
        run: node scripts/typecheck-ratchet.mjs

      # Fails when the lockfile brings in a version with a known advisory, or
      # when anything that ships has a critical one. An advisory published
      # overnight against an unchanged version only warns, in the run summary.
      # See scripts/audit-ratchet.mjs.
      - name: Dependency audit ratchet
        run: npm run audit:ratchet

      - name: Unit tests
        run: npm test

      # The database tests run against a throwaway local Supabase built from
      # production's own schema (scripts/db/test-stack.mjs; tests/db/) — row
      # security, the finish function, the signup trigger, and the app's repos
      # through real PostgREST. They had never run anywhere but a laptop, so
      # nothing stopped a schema rule from being wrong for weeks. GitHub's
      # ubuntu runners ship Docker; the CLI that starts the stack comes from
      # here, pinned to SUPABASE_CLI_VERSION in scripts/db/test-stack.mjs
      # (tests/unit/ciWorkflows.test.ts fails if the two disagree).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Database tests
        run: npm run test:integration
        timeout-minutes: 15

      # Visible, not silent: when staging publishing is switched off, the run
      # says so and says why, instead of the image job simply not appearing.
      - name: Staging publishing is off
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_PUBLISH != 'on' }}
        run: |
          echo "Staging publishing is off: see blockers B-GH and B-GHCR in Plans/caddy-deploy-and-cicd.md" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # THE STAGING IMAGE. After the checks above pass on a push to
  # main, and only when the repository variable STAGING_PUBLISH is
  # `on` (a job's own `if:` cannot read environment variables).
  #
  # It first waits for e2e.yml's run on the same commit and stops unless that
  # passed: a red check cannot publish (rule 4). e2e.yml is another workflow,
  # owned by tests-worth-their-keep.md, and cross-workflow triggers fire only
  # from main, so the wait is an API poll (scripts/ci/await-workflow.mjs).
  #
  # Then .github/actions/publish-image proves the package private, builds the
  # image of this commit, boots it, looks inside it, and only then pushes it to
  # ghcr.io/reachjvc/daygame-coach-staging as staging-<sha> and staging. This
  # machine's deploy agent pulls it from there; GitHub never logs into it.
  #
  # Every action here is pinned to a commit SHA, it never runs for a pull
  # request, and it uses no secret but GITHUB_TOKEN
  # (tests/unit/ci/pipelineRules.test.ts). Plans/caddy-deploy-and-cicd.md, step 4.3.
  # ===========================================================================
  image-staging:
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_PUBLISH == 'on' }}
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Wait for the browser tests on this commit
        run: node scripts/ci/await-workflow.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, prove and publish the staging image
        uses: ./.github/actions/publish-image
        with:
          package: daygame-coach-staging
          tag-prefix: staging
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          app-url: ${{ vars.NEXT_PUBLIC_APP_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # PRODUCTION. Only a push to main, only when the repository variable
  # PRODUCTION_PUBLISH is `on`, and only after the owner approves in the
  # `production` environment (required reviewer, set up in Phase 6).
  #
  # The checks above must have passed. e2e.yml's result for this commit is
  # written beside the approval, but does not gate it yet (Q7): that suite has
  # been red for weeks and belongs to another plan. It becomes a hard gate when
  # tests-worth-their-keep.md's Phase 9 makes it green.
  #
  # Runs never cancel each other (group publish-production), and a run whose
  # commit is no longer main's tip after the approval wait publishes nothing.
  # Plans/caddy-deploy-and-cicd.md, Phase 5 step 5.
  # ===========================================================================
  image-production:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_PUBLISH == 'on' }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: publish-production
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Only main's tip is published
        run: |
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved on to $tip since this run started; not publishing $GITHUB_SHA."
            exit 1
          fi

      - name: The browser tests' answer for this commit, beside the approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          answer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/e2e.yml")] | sort_by(.created_at) | last | select(. != null) | "\(.status) \(.conclusion // "") \(.html_url)"')"
          echo "e2e.yml on $GITHUB_SHA: ${answer:-no run found}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build, prove and publish the production image
        uses: ./.github/actions/publish-image
        with:
          package: daygame-coach-production
          tag-prefix: production
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          app-url: ${{ vars.NEXT_PUBLIC_APP_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The server's deploy agent pulls the image within a minute of the push and
  # deploys it through infra/deploy.sh. This job waits until the site itself
  # reports the commit. No `environment:` here: that would ask for a second
  # approval.
  verify-production:
    needs: image-production
    if: ${{ !cancelled() && needs.image-production.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: The site serves this commit
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "$SITE_DOMAIN" ]; then echo "::error::the repository variable SITE_DOMAIN is not set"; exit 1; fi
          body=""
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -s --max-time 10 "https://$SITE_DOMAIN/api/healthz" || true)"
            if [ "$(jq -r '.buildId // empty' <<<"$body" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              echo "https://$SITE_DOMAIN serves $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::after 10 minutes https://$SITE_DOMAIN/api/healthz does not report $GITHUB_SHA: $body"
          exit 1
