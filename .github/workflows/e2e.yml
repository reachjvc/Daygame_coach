name: E2E Tests

# Every branch, not only main and beta — the same reason as ci.yml: a branch
# nobody checks is a branch that breaks quietly.
#
# WHAT RUNS WHEN.
#
#   every push          `e2e-fast`: the desktop route sweep, minutes.
#   pull requests into  `lanes`: every pull-request lane of playwright.config.ts,
#   main and beta, and  split into shards that run side by side.
#   pushes to them
#   nightly, on demand  `nightly`: the other engines (Q5) — Firefox, desktop
#                       Safari, the iPhone (WebKit), and the route sweep on Safari.
#                       The per-push phone is Android (Pixel 7, Chromium).
#
# Until 2026-10-13 a full pass was 1,169 browser tests, one at a time, on three
# shared accounts in the live database: 3h45m, and red. Every test now signs in
# as an account of its own, made in a throwaway backend that each job starts
# for itself (playwright.config.ts → scripts/db/test-stack.mjs), so nothing
# needs an order and every shard can run at once. Plans/tests-worth-their-keep.md,
# Phases 8 and 9.
#
# NO SECRETS. The browser suite needs no Supabase key and no account password:
# the backend is local and the accounts are made per worker.
# tests/unit/ciWorkflows.test.ts fails if one is passed here again.
#
# EACH SHARD BUILDS ITS OWN APP. Measured on these runners on 2026-10-13: the
# build takes ~90 s and the backend ~50 s. One shared build would be a job of
# its own, plus an upload and a download, in front of every shard; building in
# the shard keeps it off the critical path. The build has to know the backend's
# address anyway, and each shard's backend is its own.
#
# `schedule` only ever fires on the default branch. That is a GitHub rule.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, beta]
  schedule:
    # 03:23 UTC, nightly, on the default branch only. Not on the hour: GitHub
    # runs schedules best-effort and delays them most at the top of the hour
    # (the first nightly at '0 3' started at 07:59, 2026-10-15).
    - cron: '23 3 * * *'
  workflow_dispatch:
    # Prove a flaky spec fixed: dispatch on a branch with the spec's title as
    # `grep` and repeat_each 10. Every lane then runs only the tests that match
    # (a lane with none passes at once); both empty = exactly a normal run.
    inputs:
      grep:
        description: Only run tests whose title matches this (playwright --grep)
        type: string
        default: ''
      repeat_each:
        description: Run every matching test this many times (playwright --repeat-each)
        type: number
        default: 1

permissions:
  contents: read

# onnxruntime-node (via @huggingface/transformers) downloads CUDA binaries on Linux during npm ci;
# the v1.21.0 GPU archive is gone from GitHub (404, 2026-11-18) and nothing here uses a GPU.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

# A newer push to the same branch stops the older run: its answer is about a
# commit nobody is looking at. Never the nightly run.
#
# MAIN: all main push runs share ONE group and never cancel a RUNNING run
# (`cancel-in-progress: false`). GitHub then keeps at most one running and one
# pending run per group and cancels the older PENDING one when a newer main
# push arrives (2026-11-18, B8: a dozen main pushes in an hour queued a dozen
# eleven-job runs on the free runner pool). A run that has started always
# finishes, so ci.yml's staging job still gets a verdict for any commit that
# began; for a commit whose run was cancelled while pending because main moved
# on, scripts/ci/await-workflow.mjs ends staging successfully without
# publishing ("superseded"). Any other non-success still fails it.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' }}

jobs:
  # ===========================================================================
  # THE FAST ONE. Every push.
  #
  # `sweep-desktop` opens every address in `app/` and asks the boring universal
  # questions — does the page answer, does it hydrate without throwing, is
  # anything overflowing, is a control nested inside another, does a junk URL
  # parameter render "Step NaN of 5". Those make a page useless rather than
  # imperfect, and a unit test cannot see them.
  # ===========================================================================
  e2e-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # FIRST, BEFORE ANYTHING TOUCHES THE NETWORK. The test backend's ports
      # (55320-55329, tests/db/supabase/config.toml) sit inside Linux's
      # ephemeral range, so any outbound connection — checkout, npm ci, the
      # browser and image downloads — can take one, and holds it while open
      # and for a minute after it closes. Run 38731303670 lost a shard to
      # "0.0.0.0:55324 ... address already in use"; reserving the range after
      # npm ci was too late (run 38858666954, 55322). Reserved first, the
      # kernel never hands them out. ciWorkflows.test.ts keeps the range in
      # step with config.toml and this step first.
      - name: Keep the test backend's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # Playwright's own browser download, kept between runs. Keyed on the
      # Playwright version npm ci just installed (it is in package-lock.json)
      # and the engine; `install` below skips the download when this hit.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # The production build's cache (NEXT_DIST_DIR is .next-e2e, set in
      # playwright.config.ts): a hit skips most of the ~90 s compile. A miss on
      # this commit restores the newest one for the same lockfile.
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
          # The system libraries come from apt, whose mirror was throttled to
          # 67 kB/s under load (E2E 44405093527: WebKit's 126 MB took 31 minutes,
          # Chromium's 10 minutes on three jobs). The runner image already has
          # what Chromium needs, so install them only when the browser will not
          # start without them.
          node -e "require('@playwright/test')['chromium'].launch().then((b) => b.close())" || npx playwright install-deps chromium

      # playwright.config.ts starts the test backend with this exact CLI
      # version; scripts/db/test-stack.mjs refuses any other.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Every route, opened cold
        run: npx playwright test --project=sweep-desktop ${PW_GREP:+--grep "$PW_GREP" --pass-with-no-tests} --repeat-each="${PW_REPEAT_EACH:-1}"
        env:
          CI: true
          PW_GREP: ${{ inputs.grep }}
          PW_REPEAT_EACH: ${{ inputs.repeat_each }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-e2e-fast.zip

      - name: Keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-e2e-fast
          path: blob-report/
          retention-days: 7

  # ===========================================================================
  # THE PULL-REQUEST LANES, SHARDED.
  #
  # `browser` is the engine the lane's device runs on, installed alone: the
  # iPhone is WebKit, the desktop is Chromium. ciWorkflows.test.ts checks every
  # lane against playwright.config.ts — the engine, and that the shards of a
  # lane are 1..N of N with none missing.
  # ===========================================================================
  lanes:
    # ship-* branches are where scripts/ship.mjs tests a commit before main
    # may take it, so they run every lane, like main.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/heads/ship-') }}
    name: ${{ matrix.lane }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Every shard reports: one red shard must not hide what the others found.
      fail-fast: false
      matrix:
        include:
          - { lane: desktop, shard: 1/8, browser: chromium }
          - { lane: desktop, shard: 2/8, browser: chromium }
          - { lane: desktop, shard: 3/8, browser: chromium }
          - { lane: desktop, shard: 4/8, browser: chromium }
          - { lane: desktop, shard: 5/8, browser: chromium }
          - { lane: desktop, shard: 6/8, browser: chromium }
          - { lane: desktop, shard: 7/8, browser: chromium }
          - { lane: desktop, shard: 8/8, browser: chromium }
          - { lane: timing, shard: 1/1, browser: chromium }
          - { lane: android, shard: 1/3, browser: chromium }
          - { lane: android, shard: 2/3, browser: chromium }
          - { lane: android, shard: 3/3, browser: chromium }
          - { lane: timing-android, shard: 1/1, browser: chromium }
          - { lane: sweep-android, shard: 1/1, browser: chromium }
    steps: &lane-steps
      # FIRST, BEFORE ANYTHING TOUCHES THE NETWORK. The test backend's ports
      # (55320-55329, tests/db/supabase/config.toml) sit inside Linux's
      # ephemeral range, so any outbound connection — checkout, npm ci, the
      # browser and image downloads — can take one, and holds it while open
      # and for a minute after it closes. Run 38731303670 lost a shard to
      # "0.0.0.0:55324 ... address already in use"; reserving the range after
      # npm ci was too late (run 38858666954, 55322). Reserved first, the
      # kernel never hands them out. ciWorkflows.test.ts keeps the range in
      # step with config.toml and this step first.
      - name: Keep the test backend's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # Playwright's own browser download, kept between runs. Keyed on the
      # Playwright version npm ci just installed (it is in package-lock.json)
      # and the engine; `install` below skips the download when this hit.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      # The production build's cache (NEXT_DIST_DIR is .next-e2e, set in
      # playwright.config.ts): a hit skips most of the ~90 s compile. A miss on
      # this commit restores the newest one for the same lockfile.
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The system libraries' .deb files, kept between runs. The runner image's
      # apt mirror downloaded WebKit's 126 MB at 181 kB/s (E2E 44516699059: 11 min
      # 39 s in one job, more than 20 min in others), and the nightly lanes must
      # finish in 15 minutes. Only a job whose browser will not start without
      # them (WebKit, Firefox) fills this; Chromium never does.
      - name: Cache the browser's system libraries
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browsers
        run: |
          npx playwright install ${{ matrix.browser }}
          # The system libraries come from apt, whose mirror was throttled to
          # 67 kB/s under load (E2E 44405093527: WebKit's 126 MB took 31 minutes,
          # Chromium's 10 minutes on three jobs). The runner image already has
          # what Chromium needs, so install them only when the browser will not
          # start without them.
          if ! node -e "require('@playwright/test')['${{ matrix.browser }}'].launch().then((b) => b.close())"; then
            mkdir -p ~/apt-debs
            sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            npx playwright install-deps ${{ matrix.browser }}
            sudo cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
            sudo chown -R "$USER" ~/apt-debs
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Run the lane
        run: npx playwright test --project=${{ matrix.lane }} --shard=${{ matrix.shard }} ${PW_GREP:+--grep "$PW_GREP" --pass-with-no-tests} --repeat-each="${PW_REPEAT_EACH:-1}"
        env:
          CI: true
          PW_GREP: ${{ inputs.grep }}
          PW_REPEAT_EACH: ${{ inputs.repeat_each }}
          # One name per shard, or the merge overwrites one lane's shard 1 with another's.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.lane }}-${{ strategy.job-index }}.zip

      # A blob per shard; `report` merges them into one. Traces are off under
      # CI (playwright.config.ts), so a blob carries no credential.
      - name: Keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.lane }}-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 7

  # ===========================================================================
  # NIGHTLY (Q5): the other engines, on the tests tagged for them.
  # ===========================================================================
  nightly:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.lane }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: firefox, shard: 1/1, browser: firefox }
          - { lane: webkit, shard: 1/1, browser: webkit }
          - { lane: phone, shard: 1/2, browser: webkit }
          - { lane: phone, shard: 2/2, browser: webkit }
          - { lane: timing-phone, shard: 1/1, browser: webkit }
          - { lane: sweep-phone, shard: 1/1, browser: webkit }
          - { lane: sweep-webkit, shard: 1/1, browser: webkit }
    steps: *lane-steps

  # ===========================================================================
  # THE GATE. GitHub's branch protection on main requires this one check
  # ("E2E passed"), so a commit reaches main only after every browser job
  # here passed on it (scripts/ship.mjs). On main and ship-* every lane must
  # pass; on other branches the lanes are skipped by design and only the fast
  # job counts.
  # ===========================================================================
  e2e-passed:
    name: E2E passed
    needs: [e2e-fast, lanes]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every browser job passed
        env:
          FAST: ${{ needs.e2e-fast.result }}
          LANES: ${{ needs.lanes.result }}
          FULL: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/heads/ship-') }}
        run: |
          echo "e2e-fast: $FAST, lanes: $LANES (every lane required: $FULL)"
          [ "$FAST" = success ] || exit 1
          if [ "$FULL" = true ]; then [ "$LANES" = success ] || exit 1; fi

  # ===========================================================================
  # ONE REPORT FOR THE WHOLE RUN, whichever jobs ran and however they ended.
  # ===========================================================================
  report:
    needs: [e2e-fast, lanes, nightly]
    # A red shard must not skip the report that says what went red. A
    # cancelled run (a newer push superseded it) has nothing to report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: read lets `gh` find the previous run's e2e-failures artifact.
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # WHICH COMMIT BROKE IT. The same blobs as JSON, then scripts/ci/e2e-failures.mjs
      # keeps a list of failing tests and the commit each first failed on. The list
      # lives in artifact `e2e-failures` of the run before; scripts/ci/main-status.mjs
      # reads it at session start. Tracking must never turn the report red itself.
      - name: Merge the shards' reports as JSON
        continue-on-error: true
        run: npx playwright merge-reports --reporter json ./all-blob-reports > merged.json

      # The newest earlier main push run of this workflow that kept the artifact.
      # Most main runs end cancelled (the next push supersedes the pending one) and
      # keep nothing, so one page of 100 completed runs is read and
      # `e2e-failures.mjs --previous-runs` keeps only older runs that finished
      # (success, failure, timed_out); at most 5 of those are tried. None found: no
      # previous file. The log names the run used.
      - name: Fetch the previous failures list
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          mkdir -p previous-failures
          gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?branch=main&event=push&status=completed&per_page=100" > previous-runs.json
          for id in $(node scripts/ci/e2e-failures.mjs --previous-runs previous-runs.json ${{ github.run_id }}); do
            if gh run download "$id" --repo "${{ github.repository }}" --name e2e-failures --dir previous-failures 2>/dev/null; then
              echo "previous failures list: run $id"
              break
            fi
            echo "run $id kept no e2e-failures artifact, trying an older one"
          done
          [ -f previous-failures/failures.json ] || echo "no previous failures list in the last 5 finished runs"

      # A new failure broke at one of the commits after the previous list's commit,
      # up to this one: the compare API counts them (1 = this commit alone).
      - name: Write failures.json
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          prev=""
          range=""
          if [ -f previous-failures/failures.json ]; then
            prev=previous-failures/failures.json
            psha="$(node -p 'require("./previous-failures/failures.json").sha || ""')"
            if [ -n "$psha" ]; then
              range="$(gh api "repos/${{ github.repository }}/compare/$psha...${{ github.sha }}" --jq .ahead_by 2>/dev/null || true)"
              echo "previous list at $psha, $range commit(s) up to ${{ github.sha }}"
            fi
          fi
          E2E_RANGE_COMMITS="$range" E2E_SUBJECT="$(git log -1 --format=%s)" node scripts/ci/e2e-failures.mjs merged.json $prev --out failures.json

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        with:
          name: e2e-failures
          path: failures.json
          retention-days: 14
