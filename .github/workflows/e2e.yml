name: E2E Tests

# Every branch, not only main and beta — the same reason as ci.yml: a branch
# nobody checks is a branch that breaks quietly.
#
# WHAT RUNS WHEN.
#
#   every push          `e2e-fast`: the desktop route sweep, minutes.
#   pull requests into  `lanes`: every pull-request lane of playwright.config.ts,
#   main and beta, and  split into shards that run side by side.
#   pushes to them
#   nightly, on demand  `nightly`: the other engines (Q5) — Firefox, desktop
#                       Safari, Android, and the route sweep on Safari.
#
# Until 2026-10-13 a full pass was 1,169 browser tests, one at a time, on three
# shared accounts in the live database: 3h45m, and red. Every test now signs in
# as an account of its own, made in a throwaway backend that each job starts
# for itself (playwright.config.ts → scripts/db/test-stack.mjs), so nothing
# needs an order and every shard can run at once. Plans/tests-worth-their-keep.md,
# Phases 8 and 9.
#
# NO SECRETS. The browser suite needs no Supabase key and no account password:
# the backend is local and the accounts are made per worker.
# tests/unit/ciWorkflows.test.ts fails if one is passed here again.
#
# EACH SHARD BUILDS ITS OWN APP. Measured on these runners on 2026-10-13: the
# build takes ~90 s and the backend ~50 s. One shared build would be a job of
# its own, plus an upload and a download, in front of every shard; building in
# the shard keeps it off the critical path. The build has to know the backend's
# address anyway, and each shard's backend is its own.
#
# `schedule` only ever fires on the default branch. That is a GitHub rule.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, beta]
  schedule:
    # 03:23 UTC, nightly, on the default branch only. Not on the hour: GitHub
    # runs schedules best-effort and delays them most at the top of the hour
    # (the first nightly at '0 3' started at 07:59, 2026-10-15).
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch stops the older run: its answer is about a
# commit nobody is looking at. Never on main, whose runs ci.yml's staging job
# waits for, and never the nightly run.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' }}

jobs:
  # ===========================================================================
  # THE FAST ONE. Every push.
  #
  # `sweep-desktop` opens every address in `app/` and asks the boring universal
  # questions — does the page answer, does it hydrate without throwing, is
  # anything overflowing, is a control nested inside another, does a junk URL
  # parameter render "Step NaN of 5". Those make a page useless rather than
  # imperfect, and a unit test cannot see them.
  # ===========================================================================
  e2e-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # FIRST, BEFORE ANYTHING TOUCHES THE NETWORK. The test backend's ports
      # (55320-55329, tests/db/supabase/config.toml) sit inside Linux's
      # ephemeral range, so any outbound connection — checkout, npm ci, the
      # browser and image downloads — can take one, and holds it while open
      # and for a minute after it closes. Run 38731303670 lost a shard to
      # "0.0.0.0:55324 ... address already in use"; reserving the range after
      # npm ci was too late (run 38858666954, 55322). Reserved first, the
      # kernel never hands them out. ciWorkflows.test.ts keeps the range in
      # step with config.toml and this step first.
      - name: Keep the test backend's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the test backend with this exact CLI
      # version; scripts/db/test-stack.mjs refuses any other.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Every route, opened cold
        run: npx playwright test --project=sweep-desktop
        env:
          CI: true
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-e2e-fast.zip

      - name: Keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-e2e-fast
          path: blob-report/
          retention-days: 7

  # ===========================================================================
  # THE PULL-REQUEST LANES, SHARDED.
  #
  # `browser` is the engine the lane's device runs on, installed alone: the
  # iPhone is WebKit, the desktop is Chromium. ciWorkflows.test.ts checks every
  # lane against playwright.config.ts — the engine, and that the shards of a
  # lane are 1..N of N with none missing.
  # ===========================================================================
  lanes:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}
    name: ${{ matrix.lane }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Every shard reports: one red shard must not hide what the others found.
      fail-fast: false
      matrix:
        include:
          - { lane: desktop, shard: 1/4, browser: chromium }
          - { lane: desktop, shard: 2/4, browser: chromium }
          - { lane: desktop, shard: 3/4, browser: chromium }
          - { lane: desktop, shard: 4/4, browser: chromium }
          - { lane: timing, shard: 1/1, browser: chromium }
          - { lane: phone, shard: 1/2, browser: webkit }
          - { lane: phone, shard: 2/2, browser: webkit }
          - { lane: timing-phone, shard: 1/1, browser: webkit }
          - { lane: sweep-phone, shard: 1/1, browser: webkit }
    steps: &lane-steps
      # FIRST, BEFORE ANYTHING TOUCHES THE NETWORK. The test backend's ports
      # (55320-55329, tests/db/supabase/config.toml) sit inside Linux's
      # ephemeral range, so any outbound connection — checkout, npm ci, the
      # browser and image downloads — can take one, and holds it while open
      # and for a minute after it closes. Run 38731303670 lost a shard to
      # "0.0.0.0:55324 ... address already in use"; reserving the range after
      # npm ci was too late (run 38858666954, 55322). Reserved first, the
      # kernel never hands them out. ciWorkflows.test.ts keeps the range in
      # step with config.toml and this step first.
      - name: Keep the test backend's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Run the lane
        run: npx playwright test --project=${{ matrix.lane }} --shard=${{ matrix.shard }}
        env:
          CI: true
          # One name per shard, or the merge overwrites one lane's shard 1 with another's.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.lane }}-${{ strategy.job-index }}.zip

      # A blob per shard; `report` merges them into one. Traces are off under
      # CI (playwright.config.ts), so a blob carries no credential.
      - name: Keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.lane }}-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 7

  # ===========================================================================
  # NIGHTLY (Q5): the other engines, on the tests tagged for them.
  # ===========================================================================
  nightly:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.lane }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: firefox, shard: 1/1, browser: firefox }
          - { lane: webkit, shard: 1/1, browser: webkit }
          - { lane: android, shard: 1/1, browser: chromium }
          - { lane: sweep-webkit, shard: 1/1, browser: webkit }
    steps: *lane-steps

  # ===========================================================================
  # ONE REPORT FOR THE WHOLE RUN, whichever jobs ran and however they ended.
  # ===========================================================================
  report:
    needs: [e2e-fast, lanes, nightly]
    # A red shard must not skip the report that says what went red. A
    # cancelled run (a newer push superseded it) has nothing to report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
