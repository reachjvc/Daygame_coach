package_update: true
package_upgrade: true
packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-buildx-plugin
  - tailscale
  - unattended-upgrades
  - jq
  - curl

write_files:
  # The same storage as staging (overlay2), and containers survive a daemon
  # restart, which is what an unattended Docker upgrade does.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "live-restore": true,
        "storage-driver": "overlay2",
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

  # Security updates for Ubuntu, AND for Docker and Tailscale, whose packages
  # come from their own repositories. Reboots happen at 04:00 if one is needed.
  - path: /etc/apt/apt.conf.d/52daygame-unattended-upgrades
    permissions: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Ubuntu,archive=${distro_codename}-security";
        "origin=Ubuntu,archive=${distro_codename}-updates";
        "origin=Docker,label=Docker CE";
        "origin=Tailscale,label=Tailscale";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # The journal cannot fill the disk.
  - path: /etc/systemd/journald.conf.d/50-daygame.conf
    permissions: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M

  # RULE: containers can reach neither the metadata service (which serves this
  # very file) nor the tailnet. DOCKER-USER is the chain Docker leaves for
  # rules like these; it is rebuilt when Docker starts, so a unit re-adds them.
  - path: /usr/local/sbin/daygame-docker-user-rules
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      add() { "$1" -C DOCKER-USER -d "$2" -j DROP 2>/dev/null || "$1" -I DOCKER-USER -d "$2" -j DROP; }
      add iptables 169.254.169.254/32
      add iptables 100.64.0.0/10
      add ip6tables fd7a:115c:a1e0::/48
  - path: /etc/systemd/system/daygame-docker-user.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Containers may not reach the metadata service or the tailnet
      After=docker.service
      BindsTo=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/daygame-docker-user-rules
      [Install]
      WantedBy=docker.service

runcmd:
  - [systemctl, restart, systemd-journald]
  # RULE: OpenSSH off. Port 22 is also closed at Hetzner's firewall.
  - [systemctl, disable, --now, ssh.socket, ssh.service]
  - [systemctl, mask, ssh.socket, ssh.service]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, docker.service]
  - [systemctl, enable, --now, daygame-docker-user.service]
  - [install, -d, -o, root, -g, deploy, -m, "0750", /etc/daygame]
  - [install, -d, -o, deploy, -g, deploy, -m, "0750", /var/lib/daygame]
  - [install, -d, -o, root, -g, root, -m, "0755", /opt/daygame]
  # Tailscale SSH, tagged tag:prod, with the one-off key (Q10).
  - [tailscale, up, --auth-key=@@TAILSCALE_AUTHKEY@@, --ssh, --advertise-tags=tag:prod, --hostname=daygame-prod]
