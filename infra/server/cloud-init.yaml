#cloud-config
#
# THE PRODUCTION SERVER'S FIRST BOOT, AND NOTHING MORE.
#
# Ubuntu 24.04 on Hetzner Cloud (Q8, Q18). Everything after this first boot
# arrives through infra/server/sync-infra.sh at a named commit, so the server
# can always be rebuilt from this repository plus the secrets file (rule 6).
#
# ANYTHING HERE CAN BE READ BACK from inside the server (the metadata service
# at 169.254.169.254 serves it), so nothing longer-lived than the single-use,
# one-hour Tailscale key goes in. infra/server/provision.sh fills in
# @@TAILSCALE_AUTHKEY@@ at create time; this file never holds a real key.
# Containers cannot reach the metadata service at all (the DOCKER-USER rules
# below).
#
# The apt keys are embedded, not fetched by ID, so a keyserver outage cannot
# break a first boot. Fingerprints, checked when they were written in:
#   Docker     9DC8 5822 9FC7 DD38 854A  E2D8 8D81 803C 0EBF CD88
#   Tailscale  2596 A99E AAB3 3821 893C  0A79 458C A832 957F 5868
#
# Plans/caddy-deploy-and-cicd.md, Phase 5 step 2.
# tests/unit/infra/production.test.ts guards the rules marked RULE below.

# RULE: no password logins, and (below) no OpenSSH at all. The only way in is
# Tailscale SSH from the owner's devices (Q10), or Hetzner's web console.
ssh_pwauth: false
disable_root: true

users:
  # RULE: no password, no sudo. In the docker group, which makes it
  # root-equivalent: said plainly in the plan's Security section.
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    sudo: null

